version: '3.8'

services:
  gravit-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - API_KEY=${API_KEY:-dev-key-do-not-use-in-production}
      - GRAVIT_ENV=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
